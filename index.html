<!DOCTYPE html>
<html>

<head>
    <title>Doctor Recommender</title>

    <style>

        body{
            font-family: Arial;
            padding:20px;
        }

        input{
            padding:10px;
            width:250px;
        }

        button{
            padding:10px;
            margin-top:10px;
        }

        #result{
            margin-top:20px;
            padding:15px;
            border:1px solid gray;
            border-radius:10px;
            width:350px;
        }

    </style>

</head>

<body>

<h2>Doctor / Department Recommender</h2>

<input type="text" id="symptom"
placeholder="Enter symptom">

<br>

<button onclick="getRecommendation()">
Predict
</button>

<div id="result"></div>


<script>

function getRecommendation(){

    const symptom =
    document.getElementById("symptom").value;

    fetch("http://127.0.0.1:5000/predict", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            symptom:symptom
        })

    })

    .then(res => res.json())

    .then(data => {

        console.log(data)

        if(data.error){

            document.getElementById("result").innerHTML =
            data.error

            return
        }

        if(data.message){

            document.getElementById("result").innerHTML =
            data.message

            return
        }

        let output =
        "<h3>Recommendations:</h3>"

        data.recommendations.forEach(item => {

            output += `
            <p>
            <b>${item.department}</b><br>
            Doctor: ${item.doctor}<br>
            Confidence: ${item.confidence}%
            </p>
            `
        })

        output += `
        <p><i>${data.note}</i></p>

        <p>${data.feedback}</p>

        <button onclick="sendFeedback('Yes')">
        👍 Yes
        </button>

        <button onclick="sendFeedback('No')">
        👎 No
        </button>
        `

        document.getElementById("result").innerHTML =
        output

    })

}


function sendFeedback(value){

    fetch("http://127.0.0.1:5000/feedback", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            feedback:value
        })

    })

    .then(res => res.json())

    .then(data => {

        alert(data.message)

    })

}

</script>

</body>
</html>
